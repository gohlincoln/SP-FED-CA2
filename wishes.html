<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding and responsive design settings -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Page title -->
    <title>Wishes</title>

    <!-- Linking external CSS files -->
    <link rel="stylesheet" href="./css/wishes.css" />

    <!-- Bootstrap CSS from CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />

    <!-- Additional CSS for hero section -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/bs-brain@2.0.4/components/heroes/hero-1/assets/css/hero-1.css"
    />
  </head>
  <body>
    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg bg-black navbar-dark shadow">
      <div class="container-fluid">
        <!-- Logo in the navbar -->
        <img
          src="https://acadpubassets.blob.core.windows.net/xpub/internship.sp.edu.sg/logo-white.png"
          class="navbar-brand"
          style="max-width: 10%; height: auto"
          alt="SP's logo"
        />
        <!-- Toggler button for mobile view -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <!-- Navigation links -->
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item mx-3">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item mx-3">
              <a class="nav-link" href="achievements.html">Milestones</a>
            </li>
            <li class="nav-item mx-3">
              <a class="nav-link active" href="wishes.html">Wishes</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Hero image section -->
    <section
      class="hero-image"
      style="
        background-image: url('graphics/wishesheroimage.jpg')
      "
    >
      <h2 class="visually-hidden">Wishes Hero Image</h2>
    </section>

    <!-- Main content container -->
    <section>
      <h2 class="text-center mb-4 text-danger">Your Wishes for SP</h2>
      <div class="container my-5">
        <div class="row justify-content-center">
          <div class="col-md-8">
            <!-- Form for submitting wishes -->
            <form
              id="wishesForm"
              action="#"
              method="post"
              class="bg-light p-4 rounded shadow-sm"
            >
              <!-- Name input -->
              <div class="mb-3">
                <label for="name" class="form-label">Your Name:</label>
                <input
                  type="text"
                  name="name"
                  id="name"
                  class="form-control"
                  placeholder="Enter your name"
                  required
                />
              </div>
              <!-- Email input -->
              <div class="mb-3">
                <label for="email" class="form-label">Your Email Address:</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-control"
                  placeholder="Enter your email address"
                  required
                />
              </div>
              <!-- School selection -->
              <div class="mb-3">
                <label for="school" class="form-label">Which school are you from?</label>
                <select id="school" name="school" class="form-select" required>
                  <option value="">Select your school</option>
                  <option>School of Computing (SoC)</option>
                  <option>School of Electrical & Electronic Engineering (EEE)</option>
                  <option>Media, Arts & Design School (MAD)</option>
                  <option>School of Mechanical and Aeronautical Engineering (MAE)</option>
                  <option>School of Mathematics & Science (MS)</option>
                  <option>Singapore Maritime Academy (SMA)</option>
                </select>
              </div>
              <!-- Year level selection -->
              <fieldset class="mb-3">
                <legend class="form-label">What is your current year at SP?</legend>
                <div class="form-check">
                  <input
                    type="radio"
                    id="year1"
                    name="year_level"
                    value="Year 1"
                    class="form-check-input"
                    required
                  />
                  <label for="year1" class="form-check-label">Year 1</label>
                </div>
                <div class="form-check">
                  <input
                    type="radio"
                    id="year2"
                    name="year_level"
                    value="Year 2"
                    class="form-check-input"
                    required
                  />
                  <label for="year2" class="form-check-label">Year 2</label>
                </div>
                <div class="form-check">
                  <input
                    type="radio"
                    id="year3"
                    name="year_level"
                    value="Year 3"
                    class="form-check-input"
                    required
                  />
                  <label for="year3" class="form-check-label">Year 3</label>
                </div>
                <div class="form-check">
                  <input
                    type="radio"
                    id="polyFoundation"
                    name="year_level"
                    value="Poly Foundation"
                    class="form-check-input"
                    required
                  />
                  <label for="polyFoundation" class="form-check-label">Poly Foundation</label>
                </div>
              </fieldset>

              <!-- Wishes text area -->
              <div class="mb-3">
                <label for="commBox" class="form-label">Send us your wishes for SP!(at least 100 characters)</label>
                <textarea
                  name="cExp"
                  id="commBox"
                  rows="4"
                  class="form-control"
                  required
                  minlength="100"
                ></textarea>
              </div>
              <!-- Consent checkbox -->
              <div class="form-check mb-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="remember"
                  id="remember"
                  required
                />
                <label class="form-check-label" for="remember">I consent to the sharing of this form with others</label>
              </div>
              <!-- Form action buttons -->
              <button type="submit" class="btn btn-outline-danger">Submit</button>
              <button type="reset" class="btn btn-outline-danger">Reset</button>
            </form>
            <div id="formOutput"></div>
            <!-- Placeholder for form output -->
          </div>
        </div>
      </div>
    </section>

    <!-- Footer section -->
    <footer class="bg-dark text-white">
      <div class="container text-center">
        <img
          src="graphics/sp-footer-logo.png"
          class="centered-image card-img-top"
          style="max-width: 10%; height: auto"
          alt="SP's logo"
        />
        <h5 class="card-title">Singapore Polytechnic</h5>
        <p class="card-text">500 Dover Road Singapore 139651</p>
        <p class="card-text">Made by Goh Ti Lim Lincoln DCDF/1A/04</p>
      </div>
    </footer>

    <!-- Linking JavaScript files -->
    <script src="/javascript/wishes.js"></script>
   
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
